<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trắc nghiệm: CNH, HĐH tại Đại hội VIII và vai trò sinh viên</title>
<style>
:root{
  --bg:#f3f5f2;--card:#ffffff;--ink:#1b2a2f;--muted:#5b6b70;--line:#d5dcd8;
  --accent:#1f5f5b;--accent-ink:#ffffff;--ok:#1d7a46;--ok-bg:#e3f3ea;--bad:#b3261e;--bad-bg:#fbe8e6;--hl:#f0e7c8;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#121a1b;--card:#1b2628;--ink:#e6eeec;--muted:#9bacaa;--line:#304043;--accent:#6fc3bb;--accent-ink:#0f1b1c;--ok:#6fd49a;--ok-bg:#183626;--bad:#ff8f86;--bad-bg:#3d1f1d;--hl:#3a3520}
}
:root[data-theme="dark"]{--bg:#121a1b;--card:#1b2628;--ink:#e6eeec;--muted:#9bacaa;--line:#304043;--accent:#6fc3bb;--accent-ink:#0f1b1c;--ok:#6fd49a;--ok-bg:#183626;--bad:#ff8f86;--bad-bg:#3d1f1d;--hl:#3a3520}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro","Segoe UI",Roboto,Arial,sans-serif;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:28px 18px 56px}
header h1{font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-size:1.65rem;line-height:1.3;margin:0 0 6px}
header p{margin:0;color:var(--muted);font-size:.95rem}
.bar{display:flex;align-items:center;gap:12px;margin:22px 0 18px}
.track{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);transition:width .3s}
.count{font-size:.9rem;color:var(--muted);white-space:nowrap}
.topic{display:inline-block;background:var(--hl);color:var(--ink);font-size:.85rem;padding:3px 10px;border-radius:4px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px 20px}
.q{font-family:"Source Serif 4",Georgia,serif;font-size:1.2rem;line-height:1.5;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:.85rem}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:var(--card)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--card)}
.exp{margin-top:16px;padding:14px 16px;border-left:4px solid var(--accent);background:var(--bg);border-radius:0 8px 8px 0;font-size:.95rem}
.exp strong.v{display:block;margin-bottom:4px}
.exp.good strong.v{color:var(--ok)}.exp.bad strong.v{color:var(--bad)}
.actions{display:flex;justify-content:flex-end;margin-top:18px}
.btn{font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 22px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.result{text-align:center}
.score{font-family:"Source Serif 4",Georgia,serif;font-size:3rem;margin:6px 0}
.review{list-style:none;padding:0;margin:18px 0;text-align:left}
.review li{padding:8px 0;border-top:1px solid var(--line);font-size:.93rem}
.review .ok{color:var(--ok)}.review .no{color:var(--bad)}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Đề tài 8: Công nghiệp hóa, hiện đại hóa tại Đại hội VIII (1996) và vai trò của sinh viên hiện nay</h1>
    <p>4 câu trắc nghiệm, mỗi nội dung 2 câu. Chọn đáp án để xem lời giải thích.</p>
  </header>

  <div class="bar">
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="count" id="count"></div>
  </div>

  <section id="quiz" class="card" aria-live="polite"></section>
  <section id="result" class="card result hidden"></section>
</main>

<script>
var QUESTIONS = [
  {topic:"Nội dung 1: Quan điểm CNH, HĐH tại Đại hội VIII (1996)",
   q:"Mục tiêu tổng quát mà Đại hội VIII (1996) xác định cho công cuộc công nghiệp hóa, hiện đại hóa là gì?",
   o:["Đến năm 2000, đưa nước ta trở thành nước công nghiệp phát triển",
      "Đến năm 2020, ra sức phấn đấu đưa nước ta cơ bản trở thành một nước công nghiệp",
      "Đến năm 2030, trở thành nước đang phát triển có thu nhập trung bình cao",
      "Đến năm 2045, trở thành nước phát triển có thu nhập cao"],
   a:1,
   e:"Đại hội VIII (28/6 - 1/7/1996) khẳng định các tiền đề cho công nghiệp hóa về cơ bản đã được chuẩn bị, từ đó đặt mục tiêu đến năm 2020 cơ bản trở thành một nước công nghiệp. Hai mốc 2030 và 2045 (đáp án C, D) là mục tiêu của Nghị quyết 29-NQ/TW (2022). Mốc 2000 (đáp án A) chỉ là thời điểm kết thúc kế hoạch 5 năm 1996-2000."},
  {topic:"Nội dung 1: Quan điểm CNH, HĐH tại Đại hội VIII (1996)",
   q:"Theo quan điểm của Đại hội VIII, yếu tố nào được lấy làm yếu tố cơ bản cho sự phát triển nhanh và bền vững?",
   o:["Vốn đầu tư nước ngoài","Khoa học và công nghệ","Phát huy nguồn lực con người","Tài nguyên thiên nhiên"],
   a:2,
   e:"Quan điểm thứ ba của Đại hội VIII là lấy việc phát huy nguồn lực con người làm yếu tố cơ bản cho sự phát triển nhanh và bền vững. Con người vừa là chủ thể sáng tạo ra của cải vật chất, vừa là mục tiêu thụ hưởng thành quả phát triển. Khoa học và công nghệ (đáp án B) được xác định là động lực (quan điểm thứ tư), không phải yếu tố cơ bản. Vốn nước ngoài (đáp án A) là ngoại lực, chỉ hỗ trợ nội lực."},
  {topic:"Nội dung 2: Vai trò của sinh viên hiện nay",
   q:"Theo Nghị quyết số 29-NQ/TW (17/11/2022), mục tiêu tổng quát đến năm 2030 của Việt Nam là gì?",
   o:["Trở thành nước phát triển, thu nhập cao, thuộc nhóm các nước công nghiệp hàng đầu châu Á",
      "Cơ bản trở thành nước công nghiệp theo hướng hiện đại, hoàn thành chuyển đổi số quốc gia",
      "Cơ bản đạt các tiêu chí của nước công nghiệp, là nước đang phát triển, có công nghiệp hiện đại, thu nhập trung bình cao",
      "Trở thành nước có nền kinh tế tri thức hoàn chỉnh, thu nhập trung bình thấp"],
   a:2,
   e:"Theo Nghị quyết 29-NQ/TW, đến năm 2030 Việt Nam cơ bản đạt các tiêu chí của nước công nghiệp, là nước đang phát triển, có công nghiệp hiện đại, thu nhập trung bình cao. Đáp án A là tầm nhìn đến năm 2045, không phải 2030. Đáp án B và D diễn đạt không đúng nội dung nghị quyết."},
  {topic:"Nội dung 2: Vai trò của sinh viên hiện nay",
   q:"Phong trào thi đua \"Sinh viên 5 tốt\" không bao gồm tiêu chí nào sau đây?",
   o:["Đạo đức tốt","Thể lực tốt","Hội nhập tốt","Kỷ luật tốt"],
   a:3,
   e:"Năm tiêu chí của \"Sinh viên 5 tốt\" là: đạo đức tốt, học tập tốt, thể lực tốt, tình nguyện tốt và hội nhập tốt. \"Kỷ luật tốt\" không nằm trong năm tiêu chí này. Dù tác phong công nghiệp và tính kỷ luật là kỹ năng sinh viên cần rèn luyện, đây không phải một trong 5 tiêu chí của phong trào."}
];
var L = ["A","B","C","D"];
var cur = 0, answers = [];
var quiz = document.getElementById("quiz"), result = document.getElementById("result");
var fill = document.getElementById("fill"), count = document.getElementById("count");

function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML;}

function render(){
  var Q = QUESTIONS[cur];
  count.textContent = "Câu " + (cur+1) + "/" + QUESTIONS.length;
  fill.style.width = (cur/QUESTIONS.length*100) + "%";
  var h = '<span class="topic">' + esc(Q.topic) + '</span>';
  h += '<p class="q"><strong>Câu ' + (cur+1) + '.</strong> ' + esc(Q.q) + '</p><div class="opts">';
  Q.o.forEach(function(t,i){
    h += '<button class="opt" data-i="'+i+'"><span class="k">'+L[i]+'</span><span>'+esc(t)+'</span></button>';
  });
  h += '</div><div id="fb"></div><div class="actions"></div>';
  quiz.innerHTML = h;
  quiz.querySelectorAll(".opt").forEach(function(b){
    b.addEventListener("click", function(){ pick(parseInt(b.getAttribute("data-i"),10)); });
  });
}

function pick(i){
  var Q = QUESTIONS[cur], ok = i === Q.a;
  answers[cur] = i;
  quiz.querySelectorAll(".opt").forEach(function(b,j){
    b.disabled = true;
    if(j === Q.a) b.classList.add("right");
    else if(j === i) b.classList.add("wrong");
  });
  document.getElementById("fb").innerHTML =
    '<div class="exp ' + (ok?'good':'bad') + '"><strong class="v">' +
    (ok ? 'Chính xác.' : 'Chưa đúng. Đáp án đúng: ' + L[Q.a] + '.') +
    '</strong>' + esc(Q.e) + '</div>';
  var last = cur === QUESTIONS.length-1;
  var a = quiz.querySelector(".actions");
  a.innerHTML = '<button class="btn" id="next">' + (last ? 'Xem kết quả' : 'Câu tiếp theo') + '</button>';
  var n = document.getElementById("next");
  n.addEventListener("click", function(){ last ? finish() : (cur++, render()); });
  n.focus();
}

function finish(){
  var s = 0;
  QUESTIONS.forEach(function(Q,i){ if(answers[i] === Q.a) s++; });
  fill.style.width = "100%";
  count.textContent = "Hoàn thành";
  quiz.classList.add("hidden");
  result.classList.remove("hidden");
  var h = '<p style="margin:0;color:var(--muted)">Kết quả của bạn</p><div class="score">' + s + '/' + QUESTIONS.length + '</div>';
  h += '<ul class="review">';
  QUESTIONS.forEach(function(Q,i){
    var ok = answers[i] === Q.a;
    h += '<li><span class="' + (ok?'ok':'no') + '">' + (ok?'Đúng':'Sai') + '</span> - Câu ' + (i+1) +
         ': đáp án ' + L[Q.a] + (ok ? '' : ' (bạn chọn ' + L[answers[i]] + ')') + '</li>';
  });
  h += '</ul><button class="btn ghost" id="again">Làm lại</button>';
  result.innerHTML = h;
  document.getElementById("again").addEventListener("click", function(){
    cur = 0; answers = [];
    result.classList.add("hidden"); quiz.classList.remove("hidden"); render();
  });
}
render();
</script>
</body>
</html>
