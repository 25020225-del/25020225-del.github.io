            <section>
                <h2>3. Tư duy & Cấu trúc của một Prompt hoàn hảo</h2>
                <p>Một prompt mạnh vượt trội hơn prompt yếu nhờ vào <strong>Độ rõ ràng, Tính cụ thể, Cách cung cấp Khung mẫu (Ví dụ)</strong> và định hướng <strong>Tư duy từng bước (Chain of Thought)</strong>.</p>
                
                <div class="theory-box">
                    <h3>❖ 4 Thành phần cốt lõi (R-C-T-F):</h3>
                    <ol>
                        <li><strong>Vai trò (Role):</strong> Chỉ định "danh tính" chuyên gia cho AI <em>(Ví dụ: "Bạn là chuyên gia SEO tối ưu hóa", "Huấn luyện viên thể hình")</em>.</li>
                        <li><strong>Bối cảnh (Context):</strong> Đưa ra thông tin nền tảng, lý do hoặc tình huống <em>(Ví dụ: "Tôi đang chuẩn bị ra mắt app học tiếng Anh cho trẻ em 5 tuổi...")</em>.</li>
                        <li><strong>Nhiệm vụ (Task):</strong> Hành động cụ thể cần thực hiện bằng động từ mạnh <em>(Ví dụ: "Hãy lập kế hoạch nội dung", "Hãy viết email từ chối khéo")</em>.</li>
                        <li><strong>Định dạng đầu ra (Format):</strong> Cách thức trình bày kết quả <em>(Ví dụ: "Trình bày dưới dạng bảng", "Giới hạn trong 200 từ")</em>.</li>
                    </ol>
                </div>

                <h3>❖ 5 Nguyên tắc vàng khi viết Prompt:</h3>
                <div class="rules-grid">
                    <div class="rule-card">
                        <strong>🧠 Nguyên tắc 1: Cụ thể hóa, tuyệt đối không mơ hồ</strong><br>
                        <span class="bad-prompt">❌ Kém:</span> "Viết một bài văn ngắn về tình bạn."<br>
                        <span class="good-prompt">✔️ Tốt:</span> "Viết một đoạn văn khoảng 150-200 từ kể về một kỷ niệm sâu sắc giữa hai người bạn thân, tông giọng xúc động."
                    </div>
                    
                    <div class="rule-card">
                        <strong>🧠 Nguyên tắc 2: Cung cấp ví dụ (Few-Shot Prompting)</strong><br>
                        Nếu muốn AI viết theo phong cách hoặc cấu trúc đặc biệt, cách nhanh nhất là cho nó xem mẫu trước khi ra lệnh.
                    </div>

                    <div class="rule-card">
                        <strong>🧠 Nguyên tắc 3: Khích lệ tư duy từng bước (Chain of Thought)</strong><br>
                        Đối với bài toán logic, lập trình hay chiến lược, hãy dùng câu thần chú: <em>"Hãy suy nghĩ từng bước một trước khi đưa ra câu trả lời cuối cùng"</em> để giảm thiểu lỗi ảo giác.
                    </div>

                    <div class="rule-card">
                        <strong>🧠 Nguyên tắc 4: Sử dụng các ký hiệu phân tách (Delimiters)</strong><br>
                        Dùng các ký hiệu như <code>"""</code>, <code>---</code>, hoặc <code>&lt; &gt;</code> để ngăn cách rõ ràng giữa câu lệnh hướng dẫn và phần văn bản dữ liệu nạp vào.
                    </div>

                    <div class="rule-card">
                        <strong>🧠 Nguyên tắc 5: Tập trung vào "Điều nên làm" thay vì "Điều cần tránh"</strong><br>
                        <span class="bad-prompt">❌ Kém:</span> "Đừng viết bài này một cách nhàm chán và đừng dùng từ ngữ quá hàn lâm."<br>
                        <span class="good-prompt">✔️ Tốt:</span> "Hãy viết bài này một cách sinh động, sử dụng các từ ngữ đơn giản, gần gũi với học sinh cấp 3."
                    </div>
                </div>
