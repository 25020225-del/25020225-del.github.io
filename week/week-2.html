                <h3>2. Sự thay đổi công nghệ ảnh hưởng đến tính cập nhật</h3>
                <p>Một điểm đáng lưu ý khi đánh giá các tài liệu từ năm 2021-2022 so với giai đoạn 2024-2026 là sự dịch chuyển công nghệ. Các tài liệu cũ chủ yếu tập trung vào AI phân tích (Predictive AI) dạng tĩnh, trong khi các nghiên cứu mới từ năm 2024 trở đi đã bắt đầu tích hợp AI tạo sinh (Generative AI) và học tăng cường (Reinforcement Learning) để tự động hóa ra quyết định điều phối xe theo thời gian thực (Real-time routing).</p>
            </section>
