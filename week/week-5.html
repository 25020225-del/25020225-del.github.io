                <h2>IV. Phân tích vai trò của AI và các vấn đề đạo đức</h2>
                
                <h3>1. Tác động của AI đối với quy trình sáng tạo cá nhân</h3>
                <p>AI đã chuyển đổi vai trò của tôi từ một "người thợ thực thi" (Executor) trở thành một "người điều phối" (Curator). Sự thay đổi lớn nhất nằm ở khả năng thử nghiệm nhanh. Thay vì mất cả ngày để vẽ ra một moodboard (bảng tâm trạng hình ảnh), AI cho phép tôi thấy ngay kết quả trực quan trong 30 giây. Điều này giải phóng tư duy, giúp tôi dũng cảm thử nghiệm những phong cách nghệ thuật táo bạo hơn.</p>

                <h3>2. Các vấn đề đạo đức cần cân nhắc</h3>
                <ul>
                    <li><strong>Vấn đề bản quyền dữ liệu (Copyright):</strong> Các mô hình AI được huấn luyện trên hàng tỷ bức ảnh của các họa sĩ thực thụ mà không có sự đồng thuận rõ ràng của họ. Khi tôi sử dụng phong cách "Claymation", tôi hiểu rằng mình đang gián tiếp thừa hưởng chất xám từ những nghệ sĩ đi trước. Do đó, sản phẩm cuối cùng của tôi bắt buộc phải có sự biến đổi mạnh mẽ (Transformative use), tuyệt đối không copy nguyên bản sản phẩm của AI để thương mại hóa.</li>
                    <li><strong>Sự thiên vị và định kiến (Bias):</strong> Khi prompt từ khóa "Gen Z", AI ban đầu hướng rất nhiều đến lối sống phương Tây thượng lưu. Điều này đòi hỏi người sáng tạo phải chủ động đưa các từ khóa mang tính bản địa (Địa phương hóa - Localization) để tránh việc nội dung bị rập khuôn văn hóa toàn cầu hóa, đánh mất bản sắc Việt Nam.</li>
                    <li><strong>Tính minh bạch (Transparency):</strong> Người xem có quyền được biết sản phẩm họ đang tiếp nhận có sự can thiệp của máy móc hay không. Trong báo cáo và sản phẩm truyền thông cuối cùng, tôi chọn giải pháp gắn một dòng ghi chú nhỏ (Footnote): <em>"Hình ảnh minh họa có sự hỗ trợ của trí tuệ nhân tạo (AI-assisted)"</em> nhằm tôn trọng độc giả.</li>
                </ul>
            </section>
