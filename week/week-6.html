                <p><strong>Gian lận học thuật:</strong> Đưa toàn bộ đề bài bài tập lớn lên AI, bắt AI viết code hoàn chỉnh bằng Python, sau đó đổi tên biến, xóa comment đổi thành tên mình rồi nộp lên GitHub của môn học.</p>
